<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Mountee menu bar app preview</title>
  <desc id="desc">A preview of Mountee showing an NTFS drive with read-only and read/write mount options.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f7"/>
      <stop offset="1" stop-color="#e7edf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087e83"/>
      <stop offset="1" stop-color="#13556f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#163347" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#background)"/>
  <circle cx="1175" cy="46" r="210" fill="#d9eceb" opacity=".55"/>
  <circle cx="58" cy="704" r="190" fill="#d8e2f0" opacity=".42"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="82" y="135" fill="#087e83" font-size="16" font-weight="700" letter-spacing="2.2">NTFS FOR MAC</text>
    <text x="82" y="224" fill="#152b3b" font-size="48" font-weight="720">Your drive,</text>
    <text x="82" y="281" fill="#152b3b" font-size="48" font-weight="720">one click away.</text>
    <text x="84" y="331" fill="#536879" font-size="20">Choose how to mount each NTFS drive,</text>
    <text x="84" y="359" fill="#536879" font-size="20">then find it in Finder.</text>

    <g font-size="18" fill="#273d4d">
      <circle cx="96" cy="431" r="15" fill="#d2eee8"/>
      <path d="m89 431 5 5 9-11" fill="none" stroke="#087e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="437">Read-only by default</text>

      <circle cx="96" cy="485" r="15" fill="#d2eee8"/>
      <path d="m89 485 5 5 9-11" fill="none" stroke="#087e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="491">Read/write when you choose</text>

      <circle cx="96" cy="539" r="15" fill="#d2eee8"/>
      <path d="m89 539 5 5 9-11" fill="none" stroke="#087e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="545">No kernel extension or macFUSE</text>
    </g>
    <text x="84" y="645" fill="#758896" font-size="14" font-weight="600" letter-spacing="1.2">A QUICK LOOK AT THE MENU BAR APP</text>

    <g filter="url(#shadow)" transform="translate(0 80)">
      <rect x="680" y="76" width="520" height="414" rx="22" fill="#fff"/>
      <text x="714" y="126" fill="#162b3a" font-size="23" font-weight="700">Mountee</text>
      <circle cx="1112" cy="118" r="5" fill="#36a06f"/>
      <text x="1125" y="124" fill="#398761" font-size="14" font-weight="600">Enabled</text>
      <line x1="706" y1="151" x2="1174" y2="151" stroke="#e5eaee"/>

      <rect x="714" y="177" width="36" height="33" rx="7" fill="#edf3f6"/>
      <rect x="721" y="185" width="22" height="14" rx="3" fill="none" stroke="#526b7a" stroke-width="1.8"/>
      <path d="M726 181h12m-9 22h6" stroke="#526b7a" stroke-width="1.8" stroke-linecap="round"/>
      <text x="764" y="190" fill="#1f3544" font-size="17" font-weight="650">Windows Drive</text>
      <text x="764" y="211" fill="#7b8b96" font-size="13">NTFS volume</text>
      <text x="1082" y="196" fill="#71828e" font-size="13">not mounted</text>

      <rect x="714" y="230" width="188" height="42" rx="9" fill="#f4f7f9" stroke="#d7e0e6"/>
      <text x="808" y="256" text-anchor="middle" fill="#2d4352" font-size="14" font-weight="600">Mount Read-Only</text>
      <rect x="911" y="230" width="190" height="42" rx="9" fill="url(#accent)"/>
      <text x="1006" y="256" text-anchor="middle" fill="#fff" font-size="14" font-weight="650">Mount Read/Write</text>
      <rect x="1110" y="230" width="64" height="42" rx="9" fill="#f4f7f9" stroke="#d7e0e6"/>
      <text x="1142" y="256" text-anchor="middle" fill="#2d4352" font-size="13" font-weight="600">Eject</text>

      <line x1="706" y1="300" x2="1174" y2="300" stroke="#e5eaee"/>
      <rect x="716" y="324" width="16" height="16" rx="3" fill="#fff" stroke="#9baab4" stroke-width="1.5"/>
      <path d="m719 332 4 4 7-8" fill="none" stroke="#087e83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="744" y="338" fill="#405563" font-size="14">Open Mountee at login</text>

      <text x="714" y="389" fill="#405563" font-size="14">Check for Updates…</text>
      <line x1="706" y1="414" x2="1174" y2="414" stroke="#e5eaee"/>
      <text x="714" y="448" fill="#526777" font-size="13">Refresh</text>
      <text x="778" y="448" fill="#526777" font-size="13">Copy Diagnostics</text>
      <text x="941" y="448" fill="#526777" font-size="13">♡ Donate</text>
      <text x="1117" y="448" fill="#526777" font-size="13">Quit</text>
    </g>
  </g>
</svg>
